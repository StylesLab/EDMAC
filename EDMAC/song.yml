bpm: 120

progressions:
  - name: "verse"  
    chords:
      - Bm
      - G
      - D
      - A:3
      - G:1
    control: f9   
  - name: "chorus"  
    chords:
      - G
      - A
      - G
      - A
    control: f10
  
tracks:

  - name: kick
    soundfont: D:\soundfonts\Electrokit-New-Sharp.sf2
    map:
     - x: 36
    patterns:
      - x|x|x|x
    beats: 4
    amp: 0.8
    control: f1
    status: enabled

  - name: snare
    soundfont:  D:\soundfonts\Electrokit-New-Sharp.sf2
    map:
     - x: 38
    patterns:
      - ....x.......x...|....x.......x.xx
    beats: 16
    amp: 0.8
    control: f2
    status: disabled

  - name: chords
    soundfont: D:\soundfonts\ColomboGMGS2.sf2
    bank: 0
    program: 52
    channel: 0
    map:
     - x: [3,4,5]     
    patterns:
      - x     
    beats: 4
    amp: 0.2
    control: f3
    status: disabled
  
  - name: bass
    soundfont: D:\soundfonts\ColomboGMGS2.sf2
    bank: 3
    program: 38
    channel: 0
    map:
     - x: [-3]
     - y: [0]
    patterns:
      - xyxyxyxy
    beats: 8
    amp: 0.4
    effects:
      - type: lowpass
        from: 500
        to: 9000
        durationBeats: 16
        q: 0.8 

      - type: chorus
        mix: 0.3
        rateHz: 0.35
        delayMs: 18
        depthMs: 8
    control: f4
    status: disabled

  - name: lead
    sample: D:\samples\80s Synths Samples\Multisamples\Matrix Poly\80s_MatrixPoly_C1.wav
    sampleNote: c4
    map:
     - b: [5]
     - a: [7]
     - z: [8]
     - x: [9]
     - c: [11]
    patterns:
      - ..xx..zzxx..zzxxcczz..zx.z......|..xx..zzxx..zzxxcczz..za.b......
    beats: 8
    amp: 0.5
    effects:
      - type: reverb
        mix: 0.80
        room: 0.8
        damp: 0.35
        depthMs: 8
      - type: delay
        time: dotted-eighth
        feedback: 0.35
        mix: 0.25
    control: f5
    status: disabled

  - name: arp
    sample: D:\samples\Deeper House\Instruments\RushArp\DH_RushArp-C4.wav
    sampleNote: c4
    map:
       - a: [0]   
       - b: [1]       
       - z: [3]
       - x: [4]
       - c: [5]
    beats: 16
    amp: 0.1
    patterns:
      - abzxcxzbabzxcxzbabzxcxzbabzxcxzbabzxcxzb
    control: f6
    effects:
      - type: lowpass
        from: 500
        to: 9000
        durationBeats: 16
        q: 0.8 

      - type: chorus
        mix: 0.3
        rateHz: 0.35
        delayMs: 18
        depthMs: 8
    status: disabled

  - name: fx
    sample: D:\samples\Essential Drumkits\Drum & Bass Kit\D&B Drop FX 01.wav    
    sampleNote: c
    map:     
     - x: [0]     
    patterns:
      - x...
    beats: 1
    amp: 0.1   
    control: f7
    status: disabled