bpm: 120

progressions:
  - name: "verse"  
    chords:
      - Bm
      - G
      - D
      - A:3
      - G:1
    control: f9   
  - name: "chorus"  
    chords:
      - G
      - A
      - G
      - A
    control: f10
  
tracks:

  - name: kick
    soundfont: C:\Dev\EDMAC\SONY DRP-2 Digital Drum Pad v2.sf2
    map:
     - x: 36
    patterns:
      - x|x|x|x
    beats: 4
    control: f1

  - name: snare
    soundfont: C:\Dev\EDMAC\SONY DRP-2 Digital Drum Pad v2.sf2
    map:
     - x: 38
    patterns:
      - ....x.......x...|....x.......x.xx
    beats: 16
    control: f2

  - name: chords
    soundfont: C:\Dev\EDMAC\ColomboGMGS2.sf2
    bank: 0
    program: 85
    channel: 0
    map:
     - x: [9,10,11]     
    patterns:
      - x     
    beats: 4
    amp: 0.2
    control: f3
  
  - name: bass
    soundfont: C:\Dev\EDMAC\ColomboGMGS2.sf2
    bank: 3
    program: 38
    channel: 0
    map:
     - x: [-3]
     - y: [0]
    patterns:
      - xyxyxyxy
    beats: 8
    amp: 0.4
    control: f4

  - name: lead
    soundfont: C:\Dev\EDMAC\ColomboGMGS2.sf2
    bank: 0
    program: 90
    channel: 0
    map:
     - b: [5]
     - a: [7]
     - z: [8]
     - x: [9]
     - c: [11]
    patterns:
      - ..xx..zzxx..zzxxcczz..zx........|..xx..zzxx..zzxxcczz..za.b......
    beats: 8
    amp: 1
    control: f5

